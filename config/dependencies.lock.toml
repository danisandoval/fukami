# RRV-Recomp build dependency lock.  Revisions are immutable Git object IDs.
# This lock describes source provenance only; it never captures user-provided
# game data or generated game code.

[ps2recomp]
url = "https://github.com/ran-j/PS2Recomp.git"
revision = "cf9d22b9793ab0e0591c7c23e6a50bba07fd393b"
default_checkout = "build-deps/ps2recomp-d52-compatible-v2"
require_clean_checkout = true
compatible_name = "RRV d52-compatible PS2Recomp producer v2"
compatible_revision = "bdbdede9c98b7796cff76c130177cc3fccb93f9b"
compatible_tree = "88f6378c0502a22ba55ab4d01dfcce4af7cb0d36"
compatible_patch = "tools/patches/ps2recomp-d52-compatible-v2.patch"
compatible_patch_sha256 = "281cfcd7f8635dc2ae32f01d5be6bec86942260ec3f53c92e0c9f5663c4e9f8f"
compatible_commit_date = "2026-09-04T00:00:00Z"
compatible_commit_epoch = "1788480000"
# Upstream no longer has `revision`, so this repository carries the producer in tree (third_party/ps2recomp: the
# compatible tree below plus the changes listed in its RRV_CHANGES.md). There is nothing to fetch for it:
# prepare_dependencies.py skips this component.
vendored_in_tree = "third_party/ps2recomp"

# The historical local checkout at this revision contains uncommitted runtime
# and recompiler edits.  d52 has 127 PS2Recomp patch files, but no
# checked-in ordered manifest which reconstructs that dirty tree.  It is
# therefore evidence only, not a reproducible product dependency.  Do not
# silently substitute a dirty checkout for this clean pinned revision.
historic_dirty_tree = "exact_historical_identity_unavailable_compatible_v2_is_canonical"

[sse2neon]
# ARM64 SIMD shim the runtime and the product graph compile against (-DFETCHCONTENT_SOURCE_DIR_SSE2NEON).
url = "https://github.com/DLTcollab/sse2neon.git"
revision = "92f6de174717aef09033ad21568d5bb9e5470404"
default_checkout = "build-deps/sse2neon-92f6de1"
require_clean_checkout = true

