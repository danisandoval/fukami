name: Bug report
description: Something does not work (a crash, a visual problem, bad performance, an install problem)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach or link game files** (disc images, ELF/IRX, extracted assets, captures). Issues that do are removed.
        Logs from Fukami's `sessions/` folder are fine.
  - type: input
    id: version
    attributes:
      label: Fukami version
      description: As in the release name or the app's About box.
    validations: {required: true}
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS (Apple silicon), Steam Deck (SteamOS), Other Linux x86-64]
    validations: {required: true}
  - type: input
    id: system
    attributes:
      label: Hardware and OS version
      placeholder: "MacBook Air M2, macOS 15.2  /  Steam Deck OLED, SteamOS 3.7"
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce; where in the game (menu, which track and car, which mode).
    validations: {required: true}
  - type: textarea
    id: settings
    attributes:
      label: Non-default settings
      description: Scale, ratio, car LOD, draw distance, anything you changed from the defaults.
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Paste the end of the newest log in `sessions/` (menu → Show logs), or attach it.
      render: text
